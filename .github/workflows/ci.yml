name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          # bun lint ships only in canary builds so far.
          bun-version: canary
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:install
